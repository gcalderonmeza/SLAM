<text x="698" y="52" text-anchor="middle" font-size="9" fill="#64748b">same machine as Algorithm  ·or·  any machine on same ROS2 domain</text>

<!-- RViz2 sub-box (solid border = decoupled) -->
<rect x="462" y="62" width="226" height="230" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
<rect x="462" y="62" width="226" height="26" rx="8" fill="#db2777"/>
<rect x="462" y="76" width="226" height="12" fill="#db2777"/>
<text x="575" y="77" text-anchor="middle" font-size="10" font-weight="700" fill="white">RViz2</text>
<text x="575" y="91" text-anchor="middle" font-size="8" fill="#fbcfe8">existing ROS2 tool · decoupled</text>
<text x="478" y="112" font-size="8" font-weight="600" fill="#831843">Subscribes via topics:</text>
<text x="478" y="127" font-size="7.5" fill="#64748b">/map   nav_msgs/OccupancyGrid</text>
<text x="478" y="140" font-size="7.5" fill="#64748b">/particles   PoseArray</text>
<text x="478" y="153" font-size="7.5" fill="#64748b">/path   nav_msgs/Path</text>
<text x="478" y="166" font-size="7.5" fill="#64748b">/scan   sensor_msgs/Range</text>
<text x="478" y="179" font-size="7.5" fill="#64748b">TF2 tree  (map → base_link)</text>
<text x="478" y="200" font-size="8" font-weight="600" fill="#831843">Platform:</text>
<text x="478" y="214" font-size="7.5" fill="#64748b">Linux · macOS · Windows (WSL)</text>
<text x="478" y="227" font-size="7.5" fill="#64748b">Any machine on same ROS domain</text>
<text x="478" y="240" font-size="7.5" fill="#64748b">Separate process from slam_node</text>
<text x="478" y="277" font-size="7" fill="#db2777" font-style="italic">solid border = decoupled via topics</text>

<!-- Custom sub-box (dashed border = in-process) -->
<rect x="700" y="62" width="236" height="230" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5" stroke-dasharray="5,3"/>
<rect x="700" y="62" width="236" height="26" rx="8" fill="#db2777"/>
<rect x="700" y="76" width="236" height="12" fill="#db2777"/>
<text x="818" y="77" text-anchor="middle" font-size="10" font-weight="700" fill="white">Custom Built</text>
<text x="818" y="91" text-anchor="middle" font-size="8" fill="#fbcfe8">in-process · reads memory directly</text>
<!-- C# sub -->
<rect x="712" y="98" width="212" height="82" rx="4" fill="white" fill-opacity=".6" stroke="#db2777" stroke-width=".7"/>
<text x="818" y="113" text-anchor="middle" font-size="8.5" font-weight="600" fill="#831843">C# WinForms</text>
<text x="718" y="128" font-size="7.5" fill="#64748b">Windows only · original project</text>
<text x="718" y="141" font-size="7.5" fill="#64748b">500×500 canvas, standalone</text>
<text x="718" y="154" font-size="7.5" fill="#64748b">No ROS2 required</text>
<text x="718" y="167" font-size="7.5" fill="#64748b">SlamForm.cs entry point</text>
<!-- OpenCV sub -->
<rect x="712" y="188" width="212" height="82" rx="4" fill="white" fill-opacity=".6" stroke="#db2777" stroke-width=".7"/>
<text x="818" y="203" text-anchor="middle" font-size="8.5" font-weight="600" fill="#831843">OpenCV (slam_runner)</text>
<text x="718" y="218" font-size="7.5" fill="#64748b">Cross-platform · C++ port</text>
<text x="718" y="231" font-size="7.5" fill="#64748b">cmake -DWITH_OPENCV=ON</text>
<text x="718" y="244" font-size="7.5" fill="#64748b">Embedded in slam_runner binary</text>
<text x="718" y="257" font-size="7.5" fill="#64748b">main.cpp #ifdef WITH_OPENCV</text>
<text x="818" y="277" text-anchor="middle" font-size="7" fill="#db2777" font-style="italic">dashed border = in-process with slam_runner</text>

<!-- ══════════ ROBOT ══════════ -->
