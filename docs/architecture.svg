<text x="478" y="413" font-size="7.5" fill="#64748b">HC-SR04 · GPIO trigger/echo</text>
<text x="478" y="426" font-size="7.5" fill="#64748b">also: Lidar, camera, IMU…</text>
<text x="478" y="441" font-size="7.5" font-weight="600" fill="#92400e">publishes  /scan  sensor_msgs/Range</text>
<text x="478" y="468" font-size="7" fill="#64748b" font-style="italic">extensible to any sensor type</text>

<!-- Encoder sensor node -->
<rect x="696" y="368" width="238" height="108" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<rect x="696" y="368" width="238" height="24" rx="8" fill="#d97706"/>
<rect x="696" y="380" width="238" height="12" fill="#d97706"/>
<text x="815" y="381" text-anchor="middle" font-size="9.5" font-weight="700" fill="white">Sensor Node</text>
<text x="815" y="394" text-anchor="middle" font-size="8" fill="#fde68a">encoder_driver</text>
<text x="712" y="413" font-size="7.5" fill="#64748b">Wheel encoders · quadrature count</text>
<text x="712" y="426" font-size="7.5" fill="#64748b">also: GPS, IMU…</text>
<text x="712" y="441" font-size="7.5" font-weight="600" fill="#92400e">publishes  /odom  nav_msgs/Odometry</text>
<text x="712" y="468" font-size="7" fill="#64748b" font-style="italic">extensible to any sensor type</text>

<!-- Motor actuator node -->
<rect x="462" y="486" width="224" height="88" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<rect x="462" y="486" width="224" height="24" rx="8" fill="#16a34a"/>
<rect x="462" y="498" width="224" height="12" fill="#16a34a"/>
<text x="574" y="499" text-anchor="middle" font-size="9.5" font-weight="700" fill="white">Actuator Node</text>
<text x="574" y="512" text-anchor="middle" font-size="8" fill="#bbf7d0">motor_driver</text>
<text x="478" y="530" font-size="7.5" fill="#64748b">DC motors · H-bridge · PWM</text>
<text x="478" y="543" font-size="7.5" font-weight="600" fill="#14532d">subscribes  /cmd_vel  Twist</text>
<text x="478" y="564" font-size="7" fill="#64748b" font-style="italic">extensible to any actuator type</text>

<!-- Servo actuator node -->
<rect x="696" y="486" width="238" height="88" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<rect x="696" y="486" width="238" height="24" rx="8" fill="#16a34a"/>
<rect x="696" y="498" width="238" height="12" fill="#16a34a"/>
<text x="815" y="499" text-anchor="middle" font-size="9.5" font-weight="700" fill="white">Actuator Node</text>
<text x="815" y="512" text-anchor="middle" font-size="8" fill="#bbf7d0">servo_driver</text>
<text x="712" y="530" font-size="7.5" fill="#64748b">Servo motor · sensor sweep / pan-tilt</text>
<text x="712" y="543" font-size="7.5" font-weight="600" fill="#14532d">subscribes  /servo_angle</text>
<text x="712" y="564" font-size="7" fill="#64748b" font-style="italic">extensible to any actuator type</text>

<!-- Robot middleware -->
<rect x="462" y="582" width="472" height="44" rx="6" fill="white" fill-opacity=".5" stroke="#cbd5e1" stroke-dasharray="4,3"/>
<text x="698" y="600" text-anchor="middle" font-size="8.5" font-weight="600" letter-spacing="1" fill="#64748b" font-family="Inter,sans-serif">ROBOT MIDDLEWARE</text>
<text x="698" y="616" text-anchor="middle" font-size="8" fill="#64748b">micro-ROS (ESP32 / STM32 / Arduino)  or  rclcpp (Raspberry Pi / Jetson)</text>

